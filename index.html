<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Exercise</title>
    <link rel="stylesheet" href="style.css" type="text/css">
    <script src="object constructor.js" defer></script>
    <script src="https://kit.fontawesome.com/0693518962.js" crossorigin="anonymous"></script>
</head>
<body>
    <table>
        <thead>
            <tr>
                <td>Title</td><td>Author</td><td>Pages</td><td>Read</td><td>ID</td><td></td>
            </tr>
        </thead>
        <tbody id="libraryBody"></tbody>
    </table>
    <button id="addBook">
        New Book
    </button>
    <dialog id="bookDialog">
        <form>
            <div>
                <div>
                    <label for="title">Title</label>
                    <input type="text" name="title" placeholder="The Hobbit" id="title">
                </div>
                <div>
                    <label for="author">Author</label>
                    <input type="text" name="author" placeholder="J.R.R. Tolkien" id="author">
                </div>
                <div>
                    <label for="pages">Pages</label>
                    <input type="number" name="pages" placeholder="358" id="pages">
                </div>
                <div id="readInput">
                    <label for="read">Have you read the book?</label>
                    <input type="checkbox" name="read" checked id="read">
                </div>
            </div>

            <div class="buttons">
                <button value="cancel" formmethod="dialog">Cancel</button>
                <button id="confirmBtn" value="default">Submit</button>
            </div>
        </form>
    </dialog>
</body>
</html>
